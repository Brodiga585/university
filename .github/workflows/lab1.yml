name: Lab 1 CI/CD

on:
  push:
    branches: [main, lab1-fixed, "feature/*"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Linux / ${{ matrix.project.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: dictionary
            path: lab1/english_russian_dictionary
            app: dict_app
            tests: dict_tests
          - name: turing-machine
            path: lab1/turing_machine
            app: turing_app
            tests: turing_tests
    env:
      BUILD_DIR: build_${{ matrix.project.name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install analysis and coverage tools
        run: sudo apt-get update && sudo apt-get install -y cppcheck gcovr

      - name: Run static analysis
        run: |
          cppcheck --enable=warning,performance --error-exitcode=1 \
            --std=c++17 \
            --suppress=missingIncludeSystem \
            --suppress=missingInclude \
            "${{ matrix.project.path }}/src" "${{ matrix.project.path }}/include"

      - name: Configure CMake
        run: >
          cmake -S "${{ matrix.project.path }}" -B "${{ env.BUILD_DIR }}"
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="--coverage -O0 -g"

      - name: Build
        run: cmake --build "${{ env.BUILD_DIR }}" --parallel

      - name: Run unit tests
        working-directory: ${{ env.BUILD_DIR }}
        run: ./${{ matrix.project.tests }}

      - name: Check coverage
        run: |
          gcovr -r "${{ matrix.project.path }}" \
            --filter "${{ matrix.project.path }}/src/" \
            --exclude "${{ matrix.project.path }}/src/main.cpp" \
            --fail-under-line 90 \
            --print-summary \
            "${{ env.BUILD_DIR }}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project.name }}-linux
          path: ${{ env.BUILD_DIR }}/${{ matrix.project.app }}
          if-no-files-found: error

  windows:
    name: Windows / ${{ matrix.project.name }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: dictionary
            path: lab1/english_russian_dictionary
            app: dict_app.exe
            tests: dict_tests.exe
          - name: turing-machine
            path: lab1/turing_machine
            app: turing_app.exe
            tests: turing_tests.exe
    env:
      BUILD_DIR: build_${{ matrix.project.name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S "${{ matrix.project.path }}" -B "${{ env.BUILD_DIR }}"

      - name: Build
        run: cmake --build "${{ env.BUILD_DIR }}" --config Release --parallel

      - name: Run unit tests
        working-directory: ${{ env.BUILD_DIR }}/Release
        run: .\${{ matrix.project.tests }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project.name }}-windows
          path: ${{ env.BUILD_DIR }}/Release/${{ matrix.project.app }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*

  docs:
    name: Deploy documentation
    needs: linux
    # The github-pages environment allows deployments from main only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Generate documentation
        run: doxygen Doxyfile

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload documentation
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
